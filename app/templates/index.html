<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper KB · 低空新青年</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.18 7.5 12 10.82 4.82 7.5 12 4.18zM4 8.82l7 3.5v7.36l-7-3.5V8.82zm9 10.86v-7.36l7-3.5v7.36l-7 3.5z"/>
          </svg>
          <h1>Paper KB</h1>
        </div>
        <div class="sidebar-subtitle">低空新青年</div>
      </div>

      <div class="sidebar-stats">
        <div class="stat">
          <div class="stat-value" id="statTotal">-</div>
          <div class="stat-label">Papers</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statSources">-</div>
          <div class="stat-label">Sources</div>
        </div>
      </div>

      <div class="sidebar-help">
        <button class="help-btn" onclick="showHelp()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>
          </svg>
          <span>How to Use</span>
        </button>
      </div>

      <div class="sidebar-llm">
        <div class="nav-section-title">LLM Provider</div>
        <div id="llmSelector" class="llm-selector"></div>
      </div>

      <div class="nav-section-title" style="display:flex;justify-content:space-between;align-items:center;">
        Past Research
        <span id="researchHistoryCount" class="month-count" style="font-size:11px;"></span>
      </div>
      <div id="researchHistory" class="research-history-list"></div>

      <div class="nav-section-title">Date Navigator</div>
      <div id="dateNav">
        <div class="loading">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search... (Ctrl+K or /)">
          <span class="shortcut-hint">Ctrl+K</span>
        </div>
        <button class="btn" onclick="openArxivImport()">+ arXiv</button>
        <button class="btn" onclick="openResearch()">🔬 Deep Research</button>
        <button class="btn" onclick="showDigest()">📰 Digest</button>
        <button class="btn" onclick="rescan()">Rescan</button>
      </div>

      <div id="filterLabel" class="filter-label">Showing <strong>all papers</strong></div>
      <div id="sourceFilters" class="source-filters"></div>
      <div id="statusFilters" class="source-filters"></div>

      <div class="category-section-title">Research Topics</div>
      <div id="categoryFilters" class="category-filters"></div>

      <div id="loadingState" class="loading" style="display:none;">
        <div class="loading-spinner"></div>
        <p>Loading papers...</p>
      </div>

      <div class="paper-list" id="paperList">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading papers...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Paper</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Chat FAB -->
  <button class="chat-fab" onclick="toggleChat()" title="Ask your papers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <!-- Chat Panel -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <div class="chat-header-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Ask Your Papers</span>
      </div>
      <div id="ragStatus" class="rag-status"></div>
      <button class="chat-new" onclick="newConversation()" title="New conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button class="chat-close" onclick="toggleChat()">&times;</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg system">
        <div class="msg-content">Ask questions across your 226 papers. I'll retrieve relevant passages and answer with citations.</div>
      </div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="e.g. 哪些论文研究了低空经济的信道估计？" />
      <button class="chat-send" onclick="sendChat()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
